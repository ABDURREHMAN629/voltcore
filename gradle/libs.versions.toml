[versions]
agp                = "9.4.0"
kotlin             = "2.2.10"
ksp                = "2.2.10-2.0.2"
composeBom         = "2026.08.00"
coreKtx            = "1.19.0"
lifecycle          = "2.11.0"
activityCompose    = "1.13.0"
navigation         = "2.10.0"
room               = "2.8.4"
datastore          = "1.2.1"
work               = "2.11.2"
glance             = "1.2.0"
shizuku            = "13.1.5"
serialization      = "1.9.0"
coroutines         = "1.10.2"
splashscreen       = "1.0.1"

[libraries]
# --- Core / lifecycle ---
androidx-core-ktx            = { group = "androidx.core",      name = "core-ktx",            version.ref = "coreKtx" }
androidx-splashscreen        = { group = "androidx.core",      name = "core-splashscreen",   version.ref = "splashscreen" }
androidx-lifecycle-runtime   = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-compose   = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-service   = { group = "androidx.lifecycle", name = "lifecycle-service",   version.ref = "lifecycle" }
androidx-activity-compose    = { group = "androidx.activity",  name = "activity-compose",    version.ref = "activityCompose" }

# --- Compose (versions come from the BOM) ---
androidx-compose-bom         = { group = "androidx.compose",           name = "compose-bom",        version.ref = "composeBom" }
androidx-compose-ui          = { group = "androidx.compose.ui",        name = "ui" }
androidx-compose-graphics    = { group = "androidx.compose.ui",        name = "ui-graphics" }
androidx-compose-tooling     = { group = "androidx.compose.ui",        name = "ui-tooling" }
androidx-compose-tooling-prv = { group = "androidx.compose.ui",        name = "ui-tooling-preview" }
androidx-compose-material3   = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons = { group = "androidx.compose.material", name = "material-icons-core" }
androidx-navigation-compose  = { group = "androidx.navigation",        name = "navigation-compose", version.ref = "navigation" }

# --- Data ---
androidx-room-runtime  = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx      = { group = "androidx.room", name = "room-ktx",     version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-datastore     = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# --- Background work / widgets ---
androidx-work-runtime  = { group = "androidx.work",   name = "work-runtime-ktx",  version.ref = "work" }
androidx-glance        = { group = "androidx.glance", name = "glance-appwidget",  version.ref = "glance" }
androidx-glance-m3     = { group = "androidx.glance", name = "glance-material3",  version.ref = "glance" }

# --- Privileged access (no root required) ---
shizuku-api      = { group = "dev.rikka.shizuku", name = "api",      version.ref = "shizuku" }
shizuku-provider = { group = "dev.rikka.shizuku", name = "provider", version.ref = "shizuku" }

# --- Kotlin ---
kotlinx-coroutines   = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-serialization = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }

[plugins]
android-application  = { id = "com.android.application",              version.ref = "agp" }
kotlin-compose       = { id = "org.jetbrains.kotlin.plugin.compose",  version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp                  = { id = "com.google.devtools.ksp",              version.ref = "ksp" }
